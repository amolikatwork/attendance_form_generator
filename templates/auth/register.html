<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Attendance Form Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  </head>
  <body>
    <main class="app-shell">
      <div class="container-lg py-5">
        <div class="row">
          <div class="col-lg-5 mx-auto">
            <div class="card shadow-sm border-0">
              <div class="card-body p-4">
                <!-- Logo/Header -->
                <div class="text-center mb-4">
                  <i class="fas fa-user-plus fa-3x text-success mb-3 d-block"></i>
                  <h2 class="card-title mb-1">Create Account</h2>
                  <p class="text-secondary small mb-0">Join the HR Attendance Portal</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="post" id="registerForm">
                  <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input 
                      id="username" 
                      name="username" 
                      type="text"
                      class="form-control" 
                      placeholder="Choose username"
                      required
                      minlength="3">
                  </div>

                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input 
                      id="email" 
                      name="email" 
                      type="email"
                      class="form-control" 
                      placeholder="your@email.com"
                      required>
                  </div>

                  <div class="mb-3">
                    <label for="company_name" class="form-label">Company Name</label>
                    <input 
                      id="company_name" 
                      name="company_name" 
                      type="text"
                      class="form-control" 
                      placeholder="Your Company"
                      required>
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input 
                      id="password" 
                      name="password" 
                      type="password"
                      class="form-control" 
                      placeholder="Enter password"
                      required
                      minlength="6">
                    <small class="text-muted">Minimum 6 characters</small>
                  </div>

                  <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input 
                      id="confirm_password" 
                      name="confirm_password" 
                      type="password"
                      class="form-control" 
                      placeholder="Confirm password"
                      required>
                  </div>

                  <button type="submit" class="btn btn-success w-100">
                    <i class="fas fa-user-plus"></i> Create Account
                  </button>
                </form>

                <hr class="my-4">

                <p class="text-center text-secondary small mb-0">
                  Already have an account? 
                  <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold">Login</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
